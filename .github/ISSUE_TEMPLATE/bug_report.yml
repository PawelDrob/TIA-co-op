name: Report a problem
description: Something in the bridge or a tool did not do what it should.
body:
  - type: markdown
    attributes:
      value: "**No customer projects.** Take real project, plant, company and person names out of everything you paste or attach, logs too."
  - type: input
    id: tia-version
    attributes:
      label: TIA version
      placeholder: V20
    validations:
      required: true
  - type: input
    id: tia-update
    attributes:
      label: Update
      description: From the Help menu of TIA, Installed software.
      placeholder: Update 3
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - TiaBridge
        - TIA Archive Compare
        - TiaChangeReports
        - TiaHmiGenerator or the HMI preview
        - TIA dashboard or the agent status
        - First setup
        - Development dashboard or session tool
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Quote a Siemens exception as the result gives it.
    validations:
      required: true
  - type: textarea
    id: bridge-log
    attributes:
      label: Bridge log
      description: For TiaBridge, the result of the failing call, from the `logs` folder of the project repo (`<time>_<tool>.json`). Check it for names first.
      render: json
